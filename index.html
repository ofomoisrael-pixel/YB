<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Jujutsu Kaisen</title>

  <style>
    body {
      font-family: Arial;
      background: #0f0f0f;
      color: white;
      text-align: center;
    }

    .container {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 20px;
      padding: 20px;
    }

    .card {
      background: #1c1c1c;
      border-radius: 15px;
      padding: 10px;
      width: 200px;
      transition: transform 0.2s;
    }

    .card:hover {
      transform: scale(1.05);
    }

    img {
      width: 100%;
      border-radius: 10px;
    }
  </style>
</head>

<body>

<h1>Personnages Jujutsu Kaisen</h1>

<div class="container" id="persos"></div>

<script>
fetch('/api/personnages')
  .then(res => res.json())
  .then(data => {
    const container = document.getElementById('persos');

    data.forEach(p => {
      const card = document.createElement('div');
      card.className = 'card';

      card.innerHTML = `
        <img src="${p.image}" />
        <h3>${p.nom}</h3>
      `;

      container.appendChild(card);
    });
  });
</script>

</body>
</html>
